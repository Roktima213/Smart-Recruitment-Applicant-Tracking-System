version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: smart_ats_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-smart_ats_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_ats_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Firebase Local Auth Emulator Service
  firebase-emulator:
    image: node:20-alpine
    container_name: smart_ats_firebase_emulator
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./firebase.json:/app/firebase.json:ro
      - ./.firebaserc:/app/.firebaserc:ro
    ports:
      - "9099:9099" # Firebase Auth Emulator port
      - "4000:4000" # Firebase Emulator UI port
    command: sh -c "npm install -g firebase-tools && firebase emulators:start --only auth"
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
