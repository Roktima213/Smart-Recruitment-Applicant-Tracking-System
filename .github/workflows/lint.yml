name: Code Quality & Lint Gates

on:
  push:
    branches: [main, devops, frontend, frontend-1, frontend-2, backend, cloud]
    tags: ['v*']
  pull_request:
    branches: [main, devops, frontend, backend, cloud]

jobs:
  lint-backend:
    name: Backend Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Run TypeScript Compile Check
        run: |
          cd backend
          npx tsc --noEmit

      - name: Run Backend Test Suite
        run: |
          cd backend
          npm test

  lint-frontend:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run TypeScript Compile Check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Run Vite Production Build
        run: |
          cd frontend
          npx vite build

  test-migrations:
    name: Database Migrations Runner
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smart_ats_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: |
          cd backend
          npm ci

      - name: Run Automated SQL Migrations
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: smart_ats_db
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: |
          node ./backend/node_modules/ts-node/dist/bin.js --project ./backend/tsconfig.json scripts/migrate.ts

      - name: Run Synthetic Database Seeder
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: smart_ats_db
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: |
          node ./backend/node_modules/ts-node/dist/bin.js --project ./backend/tsconfig.json --transpile-only database/seed/seed.ts
