name: Code Quality & Lint Gates

on:
  push:
    branches: [main, devops, frontend, frontend-1, frontend-2, backend, cloud]
  pull_request:
    branches: [main, devops, frontend, backend, cloud]

jobs:
  lint-backend:
    name: Backend Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Run TypeScript Compile Check
        run: |
          cd backend
          npx tsc --noEmit

      - name: Run Backend Test Suite
        run: |
          cd backend
          npm test

  lint-frontend:
    name: Frontend Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run TypeScript Compile Check
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Run Vite Production Build
        run: |
          cd frontend
          npx vite build
